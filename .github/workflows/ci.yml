name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (pyrefly)
        # Mirrors the pre-commit hook: tests use a `**(defaults | kwargs)`
        # factory pattern that pyrefly cannot narrow, producing noise that
        # would drown real bugs. Production code under `src/` is checked.
        run: uvx pyrefly check src

      - name: Run tests
        run: uv run pytest
