[project]
name = "beancount-importer"
version = "0.23.0"
description = "Modular CSV importer for beancount ledgers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "beancount>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rapidfuzz>=3.0",
    "typer>=0.12",
    "rich>=13.0",
    "tomli-w>=1.0",
    "xlrd<2.0",
]

[project.scripts]
bean-import = "beancount_importer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beancount_importer"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6",
    "ruff>=0.9",
    "mypy>=1.10",
    "xlwt>=1.3",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
# Default timeout per test in seconds (can override with @pytest.mark.timeout)
timeout = 5

[tool.coverage.run]
source = ["src/beancount_importer"]
branch = true

[tool.coverage.report]
# `cli.py` and `beancount_io/writer.py` are interactive / subprocess-driven I/O.
# We cover the splice ordering and rollback logic explicitly via mocks; the
# remaining file-handle plumbing isn't worth chasing.
omit = [
    "src/beancount_importer/cli.py",
    "src/beancount_importer/beancount_io/writer.py",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]


[tool.pyrefly]
# Tests use a `**(defaults | kwargs)` factory pattern that pyrefly
# cannot narrow; the resulting noise would drown real bugs. Hold
# production code under `src/` to a clean bar.
project_includes = ["src"]
project_excludes = ["**/__pycache__", ".venv", "scripts"]
disable-project-excludes-heuristics = true
use-ignore-files = false
python_version = "3.13"
search_path = ["."]
permissive-ignores = true
[tool.pyrefly.errors]
bad-override = false  # we frequently override the 'type: str' field with specific Literal types in subclasses
no-matching-overload = false  # pydantic/sqlmodel field type cannot be resolved correctly some of the time


[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length — codebase deliberately keeps long descriptive lines
    "B008",   # function-call defaults; pydantic Field() patterns trigger this
    "SIM102", # collapsible nested ifs — the nested form often reads better
              # when the outer/inner conditions express distinct concerns
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B017",  # pytest.raises(Exception) is fine when the type is uninteresting
    "E402",  # tests defer some imports until after fixture/path setup
]

[tool.mypy]
strict = true
