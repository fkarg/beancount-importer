[project]
name = "beancount-importer"
version = "0.1.0"
description = "Modular CSV importer for beancount ledgers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "beancount>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rapidfuzz>=3.0",
    "typer>=0.12",
    "rich>=13.0",
    "tomli-w>=1.0",
    "xlrd<2.0",
]

[project.scripts]
beancount-import = "beancount_importer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beancount_importer"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.9",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]


[tool.pyrefly]
project_includes = ["src", "tests", "migrations", "main.py", "conftest.py"]
project_excludes = ["**/__pycache__", ".venv", "scripts"]
disable-project-excludes-heuristics = true
use-ignore-files = false
python_version = "3.13"
search_path = ["."]
permissive-ignores = true
[tool.pyrefly.errors]
bad-override = false  # we frequently override the 'type: str' field with specific Literal types in subclasses
no-matching-overload = false  # pydantic/sqlmodel field type cannot be resolved correctly some of the time


[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM"]

[tool.mypy]
strict = true
